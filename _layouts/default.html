<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {%- if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  {%- endif %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- if page.map %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  {%- endif %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap site-header__bar">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">☰</button>
    <nav class="site-nav" id="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/map/' | relative_url }}"{% if page.url contains '/map' %} aria-current="page"{% endif %}>Map</a>
      <a href="{{ '/trips/' | relative_url }}"{% if page.url contains '/trips' %} aria-current="page"{% endif %}>Trips</a>
      <a href="{{ '/locations/' | relative_url }}"{% if page.url contains '/locations' %} aria-current="page"{% endif %}>Places</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>

<main id="main">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>{{ site.title }}{% if site.author %} · {{ site.author }}{% endif %}</p>
    <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </div>
</footer>

<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
{%- if page.map %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{{ '/assets/js/map.js' | relative_url }}"></script>
{%- endif %}
</body>
</html>

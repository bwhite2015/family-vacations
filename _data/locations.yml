# ---------------------------------------------------------------------------
# LOCATION REGISTRY
#
# Every location you tag in a blog post must have an entry here. The key (the
# bit before the colon) is the "id" you use in posts:
#
#     {% include loc.html id="zion" %}
#
# To add a new one, copy a block and edit it. To get lat/lng: open Google Maps,
# right-click the spot, and click the numbers at the top of the menu to copy
# them. First number is lat, second is lng.
# ---------------------------------------------------------------------------

